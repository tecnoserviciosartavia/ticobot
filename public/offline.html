<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>TicoBOT sin conexión</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(16, 185, 129, 0.18), transparent 30%),
        linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color: #e2e8f0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(92vw, 440px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 28px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.55);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(16, 185, 129, 0.14);
      color: #6ee7b7;
      font-size: 14px;
      font-weight: 600;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: 28px;
      line-height: 1.1;
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .hint {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(148, 163, 184, 0.08);
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span>●</span>
      <span>TicoBOT</span>
    </div>
    <h1>Sin conexión</h1>
    <p>Revisa tu internet y vuelve a abrir la app. Cuando recuperes conexión, el panel volverá a cargar normalmente.</p>
    <div class="hint">Si estabas escribiendo una respuesta, vuelve a abrir el chat cuando haya red para continuar.</div>
  </main>
</body>
</html>
